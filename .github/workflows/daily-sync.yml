name: Daily Sync Exam Typing Passages

on:
  schedule:
    # Run every day at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-passages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run passage sync pipeline
        env:
          ARTYPING_EMAIL: ${{ secrets.ARTYPING_EMAIL }}
          ARTYPING_PASSWORD: ${{ secrets.ARTYPING_PASSWORD }}
        run: |
          echo "[*] Syncing open-tier exam passages (TypeMangal, CGLTyping, open exam repositories)..."
          python3 scripts/sync_free_passages.py
          if [ -n "$ARTYPING_EMAIL" ] && [ -n "$ARTYPING_PASSWORD" ]; then
            echo "[*] Attempting AR Typing sync with credentials..."
            python3 scripts/sync_artyping_daily.py || echo "[!] AR Typing sync skipped or failed (unsubscribed account); open sources succeeded."
          fi

      - name: Check for changes and commit
        run: |
          git config user.name "GitHub Actions [Daily Sync]"
          git config user.email "actions@github.com"
          if ! git diff --quiet src/data/passages.ts; then
            echo "[+] New daily passages detected! Committing and pushing..."
            git add src/data/passages.ts
            git commit -m "Auto-sync daily typing paragraphs [$(date +'%Y-%m-%d')]"
            git push origin main
          else
            echo "[*] No new passages to update today."
          fi
