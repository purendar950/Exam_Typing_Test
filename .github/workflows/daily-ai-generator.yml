name: Daily AI Exam Passages Generator

on:
  schedule:
    # Run every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: 'daily-ai-gen'
  cancel-in-progress: false

jobs:
  generate-ai-passages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Multi-Exam AI Generator with Failover Chain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "[*] Generating daily exam typing passages with multi-provider failover..."
          python3 scripts/generate_daily_ai_passages.py

      - name: Commit and Push Updated Databases
        run: |
          git config user.name "Exam AI Generator [Bot]"
          git config user.email "bot@exam-typing-test.local"
          if ! git diff --quiet src/data/passages.ts; then
            echo "[+] New daily AI exam tests generated! Committing and pushing..."
            git add src/data/passages.ts
            git commit -m "Auto-generate daily exam typing tests [$(date +'%Y-%m-%d')]"
            git push origin main
          else
            echo "[*] Database already up to date for today."
          fi
